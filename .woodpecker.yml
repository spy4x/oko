# Woodpecker CI for Oko.
#
# Two steps:
#   check   — run on every push and PR. Tests + build sanity.
#   publish — only on main branch pushes. Builds the docker image and
#             pushes to ghcr.io/spy4x/oko. Uses the GHCR_PUSH_TOKEN secret
#             stored in Woodpecker (not in this file — never commit
#             tokens to source).
#
# Auto-tag handles semver tags (vX.Y.Z → 1.2.3, 1.2, latest).
#
# Required Woodpecker server config:
#   WOODPECKER_PLUGINS_PRIVILEGED=woodpeckerci/plugin-docker-buildx
# (buildx needs --privileged to spawn buildkit inside the plugin
# container). Without it, the publish step is blocked at lint time
# before the agent even gets it.
#
# To set up the secret:
#   Woodpecker UI → repo → Secrets → add GHCR_PUSH_TOKEN
#   Value: GitHub PAT with `write:packages` scope.

when:
  event: [push, pull_request, tag]

steps:
  check:
    image: golang:1.25-alpine
    commands:
      - go version
      - go mod verify
      - go vet ./...
      - gofmt -l .
      # gcc/musl-dev needed for `go test -race` (cgo required).
      - apk add --no-cache gcc musl-dev
      - go test -race -count=1 ./...
      - go build ./...

  publish:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      # `repo` is the path WITHOUT the registry prefix. The plugin adds
      # the registry prefix (`ghcr.io/`) automatically. Combining them
      # (e.g. `ghcr.io/spy4x/oko`) makes the plugin push to
      # `ghcr.io/ghcr.io/spy4x/oko` — silent 404 on ghcr.io.
      repo: spy4x/oko
      registry: ghcr.io
      dockerfile: Dockerfile
      # Multi-tag: every push to main gets :latest. Semver tags (vX.Y.Z)
      # add versioned tags (X.Y.Z, X.Y) plus update :latest.
      auto_tag: true
      # GitHub PAT classic (`ghp_*`) — username is the GitHub login
      # (`spy4x`), password is the token. Fine-grained tokens work too
      # but require `write:packages` + the matching username field.
      username: spy4x
      # Secret name is case-sensitive in Woodpecker — must match the
      # exact name set in the repo's Secrets tab. The convention
      # `GHCR_PUSH_TOKEN` is upper-snake to match the env-var feel.
      password:
        from_secret: GHCR_PUSH_TOKEN
    when:
      event: [push, tag]
      branch: main
