# Woodpecker CI for Oko.
#
# Two steps:
#   check   — run on every push and PR. Tests + build sanity.
#   publish — only on main branch pushes (and semver tags). Builds the
#             docker image and pushes to ghcr.io/spy4x/oko. Uses the
#             GHCR_PUSH_TOKEN secret stored in Woodpecker (not in this
#             file — never commit tokens to source).
#
# Why a `commands` step instead of woodpeckerci/plugin-docker-buildx:
# the plugin ran the same Docker buildx flow but authenticated in a way
# ghcr.io rejected with `insufficient_scope: authorization failed`,
# even though the same PAT works fine from a manual `docker login` +
# `docker push`. See issue #1 for the full investigation. Doing the
# login ourselves via stdin + `docker login` matches what works locally.
#
# Auto-tag (kept from the plugin's `auto_tag: true`):
#   push to main              → :latest
#   semver tag (vX.Y.Z push)  → :X.Y.Z, :X.Y, :latest
#
# To set up the secret:
#   Woodpecker UI → repo → Secrets → add GHCR_PUSH_TOKEN
#   Value: GitHub PAT with `write:packages` scope (classic `ghp_*` or
#   fine-grained with Packages: write on spy4x/oko).

when:
  event: [push, pull_request, tag]

steps:
  check:
    image: golang:1.25-alpine
    commands:
      - go version
      - go mod verify
      - go vet ./...
      - gofmt -l .
      # gcc/musl-dev needed for `go test -race` (cgo required).
      - apk add --no-cache gcc musl-dev
      - go test -race -count=1 ./...
      - go build ./...

  publish:
    # Mount the agent's docker socket so the step's docker CLI talks to
    # the host daemon directly. Avoids running a nested daemon (no
    # `privileged` needed, no WOODPECKER_PLUGINS_PRIVILEGED / repo-trust
    # requirement). Trade-off: in-container root == host root for the
    # duration of the step — acceptable in this CI setup since the
    # agent already runs as root.
    #
    # `docker:29` ships the CLI + buildx; the daemon comes from the
    # mounted socket.
    image: docker:29
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      # `echo "$TOKEN" | docker login …` — TOKEN never lands on the
      # command line (no shell history leak, no log exposure).
      - echo "$GHCR_PUSH_TOKEN" | docker login ghcr.io -u spy4x --password-stdin
      # Tag plan mirrors the old plugin's `auto_tag: true`:
      #   main push      → :latest
      #   semver tag     → :X.Y.Z + :X.Y + :latest
      - |
        set -e
        if [ -n "$CI_COMMIT_TAG" ]; then
          VERSION="${CI_COMMIT_TAG#v}"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          TAGS="-t ghcr.io/spy4x/oko:${VERSION} -t ghcr.io/spy4x/oko:${MAJOR_MINOR} -t ghcr.io/spy4x/oko:latest"
        else
          TAGS="-t ghcr.io/spy4x/oko:latest"
        fi
        docker buildx build --push --pull \
          --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
          --label "org.opencontainers.image.source=https://github.com/spy4x/oko.git" \
          --label "org.opencontainers.image.url=https://github.com/spy4x/oko" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          $TAGS \
          .
    environment:
      GHCR_PUSH_TOKEN:
        from_secret: GHCR_PUSH_TOKEN
    when:
      event: [push, tag]
      branch: main
